<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag — Leaderboard</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0b0d14; color: #e4e7f0;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 4px; }
  .sub { color: #7b82a8; font-size: 13px; }
  nav { margin-top: 12px; }
  nav a { color: #b6acf9; font-size: 12.5px; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  .tabs { display: flex; gap: 8px; margin: 16px 0 20px; flex-wrap: wrap; }
  .tab {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    border: 1.5px solid rgba(255,255,255,.09); background: rgba(255,255,255,.04);
    color: #b3b8d4; cursor: pointer;
  }
  .tab:hover { background: rgba(255,255,255,.08); }
  .tab.active { background: #7c6cf8; border-color: #7c6cf8; color: #fff; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    min-height: 44px; padding: 12px 16px; border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,.09); background: rgba(255,255,255,.04);
    text-decoration: none; color: inherit;
  }
  .row:hover, .row:active { background: rgba(255,255,255,.08); }
  .rank { flex: 0 0 24px; text-align: center; font-weight: 800; color: #7b82a8; font-size: 13px; }
  .rank.top1 { color: #ffd166; }
  .rank.top2 { color: #d8dee9; }
  .rank.top3 { color: #d99a5f; }
  /* min-width: 0 is what actually lets a flex item shrink below its text's
     natural width -- without it, text-overflow: ellipsis never kicks in
     and a long name just forces the row wider than the screen instead. */
  .name { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tier { flex: 0 0 auto; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: rgba(124,108,248,.15); color: #b6acf9; font-weight: 700; }
  .elo { flex: 0 0 auto; font-weight: 800; font-size: 15px; width: 46px; text-align: right; }
  .record { flex: 0 0 auto; color: #7b82a8; font-size: 11.5px; width: 62px; text-align: right; }
  .empty { color: #4e5578; font-size: 13.5px; padding: 40px 0; text-align: center; }
  footer { margin-top: 32px; color: #4e5578; font-size: 11.5px; text-align: center; }
  /* Narrow phones (iPhone SE and similar, ~375px and under): the W-L
     record is the least essential column here (rank/name/tier/elo tell
     the whole story), so it's the first thing to go rather than letting
     name truncation get any more aggressive than it already is. */
  @media (max-width: 380px) {
    .record { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tag — Leaderboard</h1>
      <p class="sub">Top ranked players by ELO.</p>
      <nav><a href="index.html">&larr; Server Browser</a></nav>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <footer>codecade.co.za/tag</footer>
  </div>

<script>
// Mirrors game/net/playlist_catalog.gd's PLAYLIST_ORDER -- this static page
// has no access to the Godot catalog, so the id/label pairs are hand-kept
// in sync here (the relay itself doesn't need to know team_size/team_count,
// only the id string as a ranks.json storage bucket, same reasoning as
// server.js's own rank-storage code).
const PLAYLISTS = [
  { id: '1v1', label: '1v1' },
  { id: '2v2', label: '2v2' },
  { id: '1v1v1', label: '1v1v1' },
  { id: '1v1v1v1', label: '1v1v1v1' },
];

const listEl = document.getElementById('list');
const tabsEl = document.getElementById('tabs');
let activePlaylist = PLAYLISTS[0].id;

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTabs() {
  tabsEl.innerHTML = PLAYLISTS.map(p =>
    '<div class="tab' + (p.id === activePlaylist ? ' active' : '') + '" data-id="' + p.id + '">' + esc(p.label) + '</div>'
  ).join('');
  for (const el of tabsEl.querySelectorAll('.tab')) {
    el.addEventListener('click', () => {
      activePlaylist = el.dataset.id;
      renderTabs();
      load();
    });
  }
}

function render(rows) {
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">No ranked matches played in this playlist yet.</div>';
    return;
  }
  listEl.innerHTML = rows.map((r, i) => {
    const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    const name = r.username ? esc(r.username) : esc(r.clientId).slice(0, 10) + '…';
    return '<a class="row" href="profile.html?id=' + encodeURIComponent(r.clientId) + '">' +
      '<div class="rank ' + rankClass + '">#' + (i + 1) + '</div>' +
      '<div class="name">' + name + '</div>' +
      '<div class="tier">' + esc(r.tier) + '</div>' +
      '<div class="elo">' + r.elo + '</div>' +
      '<div class="record">' + r.wins + 'W-' + r.losses + 'L</div>' +
    '</a>';
  }).join('');
}

function load() {
  fetch('api/leaderboard?limit=50&playlist=' + encodeURIComponent(activePlaylist))
    .then(r => r.json())
    .then(render)
    .catch(() => { listEl.innerHTML = '<div class="empty">Could not reach the relay server.</div>'; });
}

renderTabs();
load();
</script>
</body>
</html>
