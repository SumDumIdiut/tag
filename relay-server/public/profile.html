<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag — Profile</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0b0d14; color: #e4e7f0;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 4px; }
  .sub { color: #7b82a8; font-size: 13px; }
  nav { margin-top: 12px; }
  nav a { color: #b6acf9; font-size: 12.5px; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  .card {
    padding: 18px; border-radius: 14px; margin-bottom: 14px;
    border: 1.5px solid rgba(255,255,255,.09); background: rgba(255,255,255,.04);
  }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
  .stat-value { font-size: 22px; font-weight: 800; }
  .stat-label { color: #7b82a8; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .tier-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: rgba(124,108,248,.15); color: #b6acf9; font-weight: 700; font-size: 12.5px; margin-bottom: 10px; }
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #7b82a8; margin-bottom: 10px; }
  .ach-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .ach-pill { padding: 6px 12px; border-radius: 999px; background: rgba(63,245,168,.12); color: #3ef5a8; font-size: 12px; font-weight: 700; }
  .match-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  .match-row:last-child { border-bottom: none; }
  .match-place { font-weight: 700; }
  .match-time { color: #7b82a8; font-size: 11.5px; }
  .empty { color: #4e5578; font-size: 13.5px; padding: 20px 0; text-align: center; }
  footer { margin-top: 32px; color: #4e5578; font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">Tag — Profile</h1>
      <p class="sub" id="sub">Loading…</p>
      <nav><a href="leaderboard.html">&larr; Leaderboard</a></nav>
    </header>
    <div id="content"></div>
    <footer>codecade.co.za/tag</footer>
  </div>

<script>
const contentEl = document.getElementById('content');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtAge(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function render(p) {
  const name = p.username ? esc(p.username) : esc(p.clientId).slice(0, 10) + '…';
  titleEl.textContent = name;
  subEl.textContent = 'Level ' + p.level + ' — ' + p.xp + ' XP';

  const achievementsHtml = p.achievements.length
    ? '<div class="ach-list">' + p.achievements.map(a => '<span class="ach-pill">' + esc(a.name) + '</span>').join('') + '</div>'
    : '<div class="empty">No achievements unlocked yet.</div>';

  const matchesHtml = p.recentMatches.length
    ? p.recentMatches.map(m => {
        const mine = m.results.find(r => r.clientId === p.clientId);
        if (!mine) return '';
        return '<div class="match-row">' +
          '<div><span class="match-place">#' + mine.place + '</span> of ' + m.results.length + '</div>' +
          '<div class="match-time">' + fmtAge(m.timestamp) + '</div>' +
        '</div>';
      }).join('')
    : '<div class="empty">No ranked matches played yet.</div>';

  contentEl.innerHTML =
    '<div class="card">' +
      '<div class="tier-badge">' + esc(p.tier) + '</div>' +
      '<div class="stat-grid">' +
        '<div><div class="stat-value">' + p.elo + '</div><div class="stat-label">ELO</div></div>' +
        '<div><div class="stat-value">' + p.wins + '-' + p.losses + '</div><div class="stat-label">W-L</div></div>' +
        '<div><div class="stat-value">' + p.matchesPlayed + '</div><div class="stat-label">Matches</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="card"><div class="section-title">Achievements (' + p.achievements.length + ')</div>' + achievementsHtml + '</div>' +
    '<div class="card"><div class="section-title">Recent Matches</div>' + matchesHtml + '</div>';
}

const params = new URLSearchParams(location.search);
const id = params.get('id');
if (!id) {
  subEl.textContent = 'No player specified.';
} else {
  fetch('api/profile/' + encodeURIComponent(id))
    .then(r => r.json())
    .then(render)
    .catch(() => { subEl.textContent = 'Could not reach the relay server.'; });
}
</script>
</body>
</html>
