name: Build Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot editor
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot_editor
          Move-Item "godot_editor\Godot_v4.7-stable_win64.exe" "godot.exe"

      - name: Download and install export templates
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz -DestinationPath templates_extracted
          $dest = "$env:APPDATA\Godot\export_templates\4.7.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "templates_extracted\templates\*" $dest -Recurse -Force

      - name: Import project (registers global class names)
        shell: pwsh
        run: .\godot.exe --headless --path game --editor --quit

      # Stamps this run's number into build_version.gd (committed as 0, i.e.
      # "dev build") -- UpdateChecker compares a running client's own
      # BUILD_NUMBER against the numeric suffix of the latest GitHub Release
      # tag ("build-<run number>", set below in "Publish build as a
      # release"), so the two need to always match up.
      - name: Stamp build version
        shell: pwsh
        run: |
          (Get-Content game\build_version.gd) -replace 'const BUILD_NUMBER := 0', "const BUILD_NUMBER := $($env:GITHUB_RUN_NUMBER)" | Set-Content game\build_version.gd

      - name: Create builds directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path builds

      # The Godot CLI has been observed exiting almost instantly with no
      # error and no output on some CI runs -- no scan, no pack, nothing --
      # leaving the target .exe missing, while the very next export (same
      # runner, same project) always succeeds. Root cause not pinned down
      # (doesn't reproduce locally); retrying with a short pause is a
      # pragmatic, standard fix for this class of intermittent CLI failure
      # regardless of cause, and verifies the file actually landed instead
      # of trusting a zero exit code.
      # A fixed "invoke once, check immediately, sleep 5s, retry" loop turned
      # out to race a real failure mode: sometimes the export genuinely
      # finishes later than a fixed short sleep accounts for (observed one
      # run where the real savepack/export work was still visibly running
      # well after all 3 attempts had already given up and thrown). Polling
      # for the file to actually appear for a while after each invocation,
      # instead of assuming "still missing right now" means "this attempt
      # failed," fixes that race without needing to pin down exactly why a
      # given invocation is sometimes slow to land the file.
      - name: Export client
        shell: pwsh
        run: |
          $maxAttempts = 3
          $pollTimeoutSec = 60
          $pollIntervalSec = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            .\godot.exe --headless --path game --export-release "Windows Desktop" "../builds/Tag.exe"
            $waited = 0
            while (-not (Test-Path "builds\Tag.exe") -and $waited -lt $pollTimeoutSec) {
              Start-Sleep -Seconds $pollIntervalSec
              $waited += $pollIntervalSec
            }
            if (Test-Path "builds\Tag.exe") { break }
            Write-Host "Tag.exe missing after attempt $i (waited up to ${pollTimeoutSec}s) -- retrying..."
          }
          if (-not (Test-Path "builds\Tag.exe")) { throw "Tag.exe still missing after $maxAttempts attempts" }

      # The WebRTC GDExtension (game/addons/webrtc_native/webrtc_native.gdextension)
      # declares its library at "lib/libwebrtc_native...dll" relative to itself --
      # that path has to stay as-is, since Godot's export step uses that same
      # relative path to find the source file to copy in the first place. But
      # export's own copy step drops the "lib/" nesting and lands the .dll flat
      # next to Tag.exe, while the runtime GDExtension loader looks for it back
      # at the original nested res://addons/webrtc_native/lib/... path -- so
      # without this, every build fails to load the extension (Error 126) even
      # though the .dll is right there, just in the wrong spot. Mirroring it
      # into the nested path it actually gets looked up at reconciles the two.
      - name: Fix WebRTC native library placement
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "builds\addons\webrtc_native\lib" | Out-Null
          Copy-Item "builds\libwebrtc_native.windows.*.dll" "builds\addons\webrtc_native\lib\" -Force

      # Tag.exe can no longer be shipped as a single loose file now that it
      # needs the WebRTC .dll sitting beside it at a specific relative path
      # -- a real installer (Start Menu/Desktop shortcuts, Add/Remove
      # Programs entry, uninstaller) handles that layout itself instead of
      # players having to extract a zip to the right place by hand, and
      # lets in-app updates (see update_prompt.gd) just silently re-run it
      # rather than the old hand-rolled wait-for-exit-then-swap .bat script.
      # windows-latest runners ship Inno Setup 6 preinstalled.
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\tag.iss "/DMyAppVersion=$($env:GITHUB_RUN_NUMBER)"
          if (-not (Test-Path "builds\TagSetup.exe")) { throw "TagSetup.exe missing after ISCC run" }

      - name: Export art tool
        shell: pwsh
        run: |
          $maxAttempts = 3
          $pollTimeoutSec = 60
          $pollIntervalSec = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            .\godot.exe --headless --path game --export-release "Art Tool" "../builds/TagArtTool.exe"
            $waited = 0
            while (-not (Test-Path "builds\TagArtTool.exe") -and $waited -lt $pollTimeoutSec) {
              Start-Sleep -Seconds $pollIntervalSec
              $waited += $pollIntervalSec
            }
            if (Test-Path "builds\TagArtTool.exe") { break }
            Write-Host "TagArtTool.exe missing after attempt $i (waited up to ${pollTimeoutSec}s) -- retrying..."
          }
          if (-not (Test-Path "builds\TagArtTool.exe")) { throw "TagArtTool.exe still missing after $maxAttempts attempts" }

      - name: Publish build as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "build-$($env:GITHUB_RUN_NUMBER)"
          gh release create $tag "builds/TagSetup.exe" "builds/TagArtTool.exe" `
            --title "Build $($env:GITHUB_RUN_NUMBER)" `
            --notes "Automated build from commit $($env:GITHUB_SHA). Run TagSetup.exe to install (or update an existing install) -- it hosts too (Casual/Private/Ranked all just spawn a second copy of itself as a local server, nothing extra to download). Download TagArtTool.exe to paint levels and menu chrome/icons -- see ART_GUIDE.md."
